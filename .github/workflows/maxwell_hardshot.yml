name: Maxwell Demon - difficult 10s gate-shot QA
on:
  push:
    branches: [maxwell-demon-gpt6]
    paths:
      - 'src/MaxwellDemon.tsx'
      - 'src/maxwellMotion.ts'
      - 'src/Root.tsx'
      - 'content/maxwell_demon.json'
      - 'scripts/maxwell_motion_test.cjs'
      - '.github/workflows/maxwell_hardshot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maxwell-hardshot
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CJK fonts and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install pinned React/Remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
      - name: Typecheck and molecule/gate invariants
        run: |
          npm run typecheck
          node scripts/maxwell_motion_test.cjs
      - name: Render 18-28 second gate/selection shot
        run: |
          mkdir -p out/maxwell/hardshot
          npx remotion render src/index.ts MaxwellDemon out/maxwell/hardshot/Maxwell-10s-FirstPass.mp4 --frames=540-839 --codec h264 --crf 18 --concurrency 2 --log=error
      - name: Inspectable 40 continuous 0.25s frames and 720p closeups
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/maxwell/hardshot/Maxwell-10s-FirstPass.mp4 -vf 'fps=4,scale=180:320,tile=8x5' -frames:v 1 out/maxwell/hardshot/gate_025s.jpg
          for t in 0.0 1.0 1.75 2.15 3.0 4.2 5.6 6.2 7.0 8.1 9.5; do ffmpeg -hide_banner -loglevel error -y -ss "$t" -i out/maxwell/hardshot/Maxwell-10s-FirstPass.mp4 -frames:v 1 "out/maxwell/hardshot/close_$t.png"; done
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames:format=duration -of json out/maxwell/hardshot/Maxwell-10s-FirstPass.mp4 > out/maxwell/hardshot/probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: maxwell-10-second-gate-shot
          path: out/maxwell/hardshot/**
          retention-days: 14
          if-no-files-found: error
