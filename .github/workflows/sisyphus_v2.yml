name: Sisyphus V2 - 14 semantic shots and visual review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/SisyphusV2.tsx'
      - 'content/sisyphus_v2.json'
      - 'scripts/sisyphus_v2_qc.py'
      - '.github/workflows/sisyphus_v2.yml'
permissions:
  contents: read
concurrency:
  group: sisyphus-v2-main
  cancel-in-progress: true
jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Pinned Remotion and TTS dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt "edge-tts>=7,<10" "pydub==0.25.1"
          npx remotion browser ensure
      - name: Validate source types
        run: npm run typecheck
      - name: Generate matched Mandarin speech and SFX score
        run: python scripts/sisyphus_audio.py --v2
      - name: Render 14 semantic scene compositions
        run: |
          mkdir -p out
          npx remotion render src/index.ts SisyphusV2 out/v2_silent.mp4 --codec h264 --crf 18 --concurrency 2 --log=error
      - name: Mix score underneath narration
        run: bash scripts/mix_audio.sh out/v2_silent.mp4 out/sisyphus_music.wav out/sisyphus_v2.mp4 out/sisyphus_voice.wav
      - name: Technical QA and review image export
        run: |
          python scripts/sisyphus_v2_qc.py
          ffmpeg -hide_banner -loglevel error -y -i out/sisyphus_v2.mp4 -vf "fps=1/7.5,scale=240:427,tile=4x3" -frames:v 1 out/v2_review/contact_sheet.jpg
      - name: Preserve final movie and review evidence
        uses: actions/upload-artifact@v4
        with:
          name: sisyphus-v2-review
          path: |
            out/sisyphus_v2.mp4
            out/v2_review/*.jpg
            out/v2_review/*.json
            out/v2_review/*.png
            out/sisyphus_voice_report.json
          retention-days: 14
          if-no-files-found: error
