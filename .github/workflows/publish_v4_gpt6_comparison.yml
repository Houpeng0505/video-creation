name: Publish V4 GPT-6 comparison as durable downloads
on:
  push:
    branches: [sisyphus-v4-gpt6]
    paths:
      - '.github/workflows/publish_v4_gpt6_comparison.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  compare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and verify encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Fetch exact verified GPT6 film from completed workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/comparison
          gh run download 39038251918 --name sisyphus-v4-gpt6-complete-review --dir out/comparison
          test -s out/comparison/Sisyphus-V4-GPT6-90s.mp4
          test -s out/comparison/review/storyboard.jpg
          cp out/comparison/review/storyboard.jpg out/comparison/Sisyphus-V4-GPT6-storyboard.jpg
      - name: Download independent baseline V4 (the version already on GitHub)
        run: |
          curl -fL --retry 4 --retry-delay 2 -o out/comparison/Sisyphus-V4-baseline.mp4 https://github.com/Houpeng0505/video-creation/releases/download/sisyphus-v4.0/Sisyphus-V4-90s.mp4
          test -s out/comparison/Sisyphus-V4-baseline.mp4
      - name: Create frame-aligned 90 second side-by-side comparison
        run: |
          ffmpeg -hide_banner -loglevel error -y -i out/comparison/Sisyphus-V4-baseline.mp4 -i out/comparison/Sisyphus-V4-GPT6-90s.mp4 -filter_complex "[0:v]scale=360:640,setsar=1[left];[1:v]scale=360:640,setsar=1[right];[left][right]hstack=inputs=2[v]" -map "[v]" -map 1:a:0 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a copy -t 90 -movflags +faststart out/comparison/V4-vs-GPT6-SideBySide.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json out/comparison/V4-vs-GPT6-SideBySide.mp4
      - name: Publish separate immutable release; preserve original V3 and V4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sisyphus-v4-gpt6.0 >/dev/null 2>&1; then
            echo "Tag is already published; refusing to replace benchmark evidence"; exit 1
          fi
          gh release create sisyphus-v4-gpt6.0 out/comparison/Sisyphus-V4-GPT6-90s.mp4 out/comparison/Sisyphus-V4-GPT6-storyboard.jpg out/comparison/V4-vs-GPT6-SideBySide.mp4 --target sisyphus-v4-gpt6 --title "西西弗斯 V4 · GPT-6 同条件对照" --notes-file docs/SISYPHUS_V4_GPT6_COMPARISON_QA.md
          gh release view sisyphus-v4-gpt6.0 --json url,assets
      - name: Verify external permanent URL
        run: |
          curl -fsSIL --retry 3 --max-time 45 https://github.com/Houpeng0505/video-creation/releases/download/sisyphus-v4-gpt6.0/Sisyphus-V4-GPT6-90s.mp4 -o /tmp/header.txt
          head -n 12 /tmp/header.txt
